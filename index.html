<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunara AI - Mistik Rehber</title>
    <style>
        /* Ana Sayfa Düzeni ve Çakışmayı Önleyen Flexbox Yapısı */
        .main-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: flex-start !important;
            gap: 30px !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        /* Sol Kredi Paketleri Menüsü */
        .credit-sidebar {
            flex: 0 0 280px !important;
            width: 280px !important;
            position: relative !important;
            left: auto !important;
            top: auto !important;
            z-index: 10 !important;
        }

        /* Sağ İçerik ve Burç Yorumları Alanı */
        .content-area {
            flex: 1 !important;
            min-width: 0 !important;
            width: 100% !important;
        }

        /* Burç Yorum Metin Biçimlendirmesi */
        .horoscope-result p {
            margin-bottom: 18px;
            line-height: 1.7;
            font-size: 1.05rem;
            text-align: justify;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- İçerik Alanı -->
        <div class="content-area">
            <div id="horoscope-display" class="horoscope-result">
                <!-- Burç yorumları JS tarafından en az 4 uzun paragraf olarak yüklenecektir -->
            </div>
        </div>
    </div>

    <script>
        // En az 4 uzun ve detaylı paragraf üreten Burç Analiz Fonksiyonu
        function getZodiacAnalysis(signName) {
            const p1 = `${signName} burcu için günün kozmik etkileri ve genel enerjileri oldukça yüksek bir uyanış evresine işaret ediyor. ` +
                       `Gökyüzündeki gezegen konumları, zihninizde uzun süredir yanıt aradığınız karmaşık soruların netleşmesine yardımcı olacak güçlü frekanslar yayıyor. ` +
                       `Ruhsal olarak kendinizi yeniden keşfettiğiniz bu dönemde, evrenin size sunduğu işaretleri ve eşzamanlılıkları dikkatle takip etmeniz gerekiyor. ` +
                       `İçsel potansiyelinizin gün yüzüne çıkmasıyla birlikte hayatınızdaki eski kalıpları kırıp yepyeni bir sayfa açmak için mükemmel bir zamandasınız.`;

            const p2 = `Aşk ve ikili ilişkilerde kalp çakranızın enerjisi ön plana çıkıyor. Partnerinizle olan bağlarınızda sadakat, şeffaflık ve derin bir ruhi çekim hakim olacak. ` +
                       `Bastırılmış duyguların ve konuşulmayan hislerin açıklıkla ifade edileceği bu süreçte aranızdaki güven duygusu katlanarak artacaktır. ` +
                       `Yalnız olan ${signName} bireyleri için geçmişin yüklerini tamamen geride bırakıp yeni ve kadersel bir ruh eşi çekimine açık olma vakti geldi. ` +
                       `Duygusal dünyanızda dengeleri kurmak, ilişkilerinize çok daha sağlam ve huzurlu bir zemin kazandıracaktır.`;

            const p3 = `Kariyer, finans ve hedefler alanında ise stratejik adımlar atmanız gereken disiplinli bir döneme giriyorsunuz. ` +
                       `İş hayatınızdaki projeler ve maddi hedefleriniz yönünden sezgileriniz ile mantığınızı dengede tutarak hareket etmeniz büyük önem taşıyor. ` +
                       `Karşınıza çıkabilecek yeni iş fırsatları veya finansal kararlarda acele etmeden, uzun vadeli kazançları göz önünde bulundurmalısınız. ` +
                       `Çalışma azminiz, odaklanma yeteneğiniz ve ortaya koyduğunuz emekler sayesinde çevrenizden beklediğiniz takdiri ve bolluk bereket akışını elde edeceksiniz.`;

            const p4 = `Kozmik tavsiye ve gelecek projeksiyonuna baktığımızda; yıldızlar size sabırlı olmanızı ve akışa güvenmenizi öğütlüyor. ` +
                       `Önümüzdeki günlerde karşınıza çıkabilecek olası pürüzler veya gecikmeler, aslında sizi daha doğru bir yola sevk etmek için karşınıza çıkan tecrübelerdir. ` +
                       `İçsel bilgeliğinize güvenin, günlük hayatın stresi içinde ruhsal pratiklerinizi ve kendinize ayırdığınız vakti ihmal etmeyin. ` +
                       `Işığınıza ve kendi gücünüze inandığınız sürece yıldızların rehberliği sizi en parlak döneminize taşımaya devam edecektir.`;

            return `<p>${p1}</p><p>${p2}</p><p>${p3}</p><p>${p4}</p>`;
        }
    </script>
</body>
</html>
